name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26   # the app uses glassEffect, which needs the macOS 26 SDK
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs; Dependabot proposes updates.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build universal app
        run: cd app && ./build.sh

      - name: Selftest
        run: |
          export HOME=/tmp/wigglet-ci-home && mkdir -p "$HOME"   # --selftest refuses a HOME outside /tmp/
          app/Wigglet.app/Contents/MacOS/Wigglet --selftest

      - name: Pixel audit
        run: |
          export HOME=/tmp/wigglet-ci-home && mkdir -p "$HOME"   # --selftest refuses a HOME outside /tmp/
          app/Wigglet.app/Contents/MacOS/Wigglet --pixel-audit

      - name: Frame audit
        run: |
          export HOME=/tmp/wigglet-ci-home && mkdir -p "$HOME"
          app/Wigglet.app/Contents/MacOS/Wigglet --frame-audit

      - name: Zip
        run: ditto -c -k --keepParent app/Wigglet.app Wigglet.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Wigglet-${{ github.sha }}
          path: Wigglet.zip
          retention-days: 14
