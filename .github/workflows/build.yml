name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        run: cd app && ./build.sh

      - name: Selftest
        run: |
          export HOME=/tmp/clawd-ci-home && mkdir -p "$HOME"   # --selftest refuses a HOME outside /tmp/
          app/ClawdPet.app/Contents/MacOS/ClawdPet --selftest

      - name: Pixel audit
        run: |
          export HOME=/tmp/clawd-ci-home && mkdir -p "$HOME"   # --selftest refuses a HOME outside /tmp/
          app/ClawdPet.app/Contents/MacOS/ClawdPet --pixel-audit

      - name: Zip
        run: ditto -c -k --keepParent app/ClawdPet.app ClawdPet.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ClawdPet-${{ github.sha }}
          path: ClawdPet.zip
          retention-days: 14
